name: Diagrams

# A PR that changes a PlantUML source must also commit its re-rendered PNG
# (#107): indexing_flow.puml was edited while its PNG stayed months older (#67).
on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "docs/plantuml/**"

permissions: read-all

jobs:
  png-matches-source:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # the check diffs against the base branch

    - name: Set up Python 3.12
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Check each changed diagram source has its PNG
      run: python tests/linting/check_diagram_pngs.py "origin/${{ github.base_ref }}"
