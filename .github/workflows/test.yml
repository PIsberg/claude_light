name: Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Declare default permissions as read only.
permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # requirements.txt is the list the installers and the SBOM use, so the
        # suite runs on the same dependencies a user gets (#72).
        pip install -r requirements.txt "pytest>=9.2.0" "pytest-timeout>=2.4.0"

    - name: Run unit tests
      run: |
        # Run editor tests first (before MockManager patches Path)
        python -m pytest tests/unit/test_editor.py -q --timeout=60
        # Run config tests (before MockManager patches Path)
        python -m pytest tests/unit/test_config.py -q --timeout=60
        # Run remaining unit tests
        python -m pytest tests/unit/ --ignore=tests/unit/test_editor.py --ignore=tests/unit/test_config.py -q --timeout=120 -x

    - name: Run integration and utilities tests
      run: |
        python -m pytest tests/integration/ tests/utilities/ -q --timeout=120 -x

    - name: Run analytical benchmark
      run: |
        python tests/benchmarks/benchmark.py --json > tests/baseline_token_stats_new.json
        python tests/linting/check_regression.py tokens tests/fixtures/baseline_token_stats.json tests/baseline_token_stats_new.json

    - name: Run retrieval benchmark (offline fixture)
      run: |
        python tests/benchmarks/benchmark_retrieval.py --fixture tests/fixtures/retrieval_cases.json --output tests/baseline_retrieval_stats_new.json
        python tests/linting/check_regression.py retrieval tests/fixtures/baseline_retrieval_stats.json tests/baseline_retrieval_stats_new.json
