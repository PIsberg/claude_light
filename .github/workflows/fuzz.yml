name: Fuzz Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run fuzz tests weekly on Monday at 00:00 UTC
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest hypothesis sentence-transformers numpy watchdog anthropic prompt_toolkit rich tree-sitter tree-sitter-python

    - name: Run fuzz tests
      run: |
        python -m pytest tests/test_fuzz.py -v --tb=short
      env:
        HYPOTHESIS_MAX_EXAMPLES: 500
        HYPOTHESIS_DEADLINE: 2000
