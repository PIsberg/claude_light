name: Fuzz Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run fuzz tests weekly on Monday at 00:00 UTC
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Same list as the installers and test.yml (#72); it includes hypothesis.
        pip install -r requirements.txt "pytest>=9.2.0"

    - name: Run fuzz tests
      run: |
        python -m pytest tests/test_fuzz.py -v --tb=short
      env:
        HYPOTHESIS_MAX_EXAMPLES: 500
        HYPOTHESIS_DEADLINE: 2000
