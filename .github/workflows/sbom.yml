name: Generate SBOM

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:

# Declare default permissions as read only.
permissions: read-all

jobs:
  sbom:
    runs-on: ubuntu-latest
    # Write is needed by the release-upload step below; the top-level
    # read-all does not apply once a job sets its own permissions.
    permissions:
      contents: write
      actions: write
    steps:
    - name: Harden the runner
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cyclonedx-bom

    - name: Generate SBOM
      run: |
        cyclonedx-py requirements -i requirements.txt -o sbom.json

    - name: Upload SBOM Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sbom
        path: sbom.json

    - name: Upload SBOM to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: sbom.json
