version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # requirements.txt and pyproject.toml only declare lower bounds (">=");
    # raise them so the floors track what CI actually tests against.
    versioning-strategy: increase
    groups:
      # Minor and patch bumps share one PR instead of one PR per package (six
      # separate PRs on 2026-10-24). Majors get their own PR: anthropic 2.x
      # (httpx -> httpx2) broke tests, and one breaking bump should not hold
      # back every minor update.
      python-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
